<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
body{
    background-color: darkblue;
    color: white;
    font-family: Arial, sans-serif;
}

.hero-name{
    font-size: 60px;
    font-weight: bold;
    color: yellow;
    text-shadow: 3px 3px orange;

}

.tagline{
    font-style: italic;
    color: rgb(5, 225, 178);
    text-transform: capitalize;
}

.label{
    text-transform: uppercase;
    text-decoration: underline;
    color: coral;
}

.power{
    font-weight: bold;
    color: lightgreen;
}

.weakness{
    text-decoration: line-through;
    color: gray;
}

.badge{
    font-size: 28px;
    font-weight: bold;
    color: gold;
    transform: rotate(15deg);
}

    </style>
</head>
<body>
    
    <hi class="hero-name">Thunder kid</hi>
    <p class="tagline">the most powerful hero  in the school</p>

    <h2 class="label">super powers</h2>
    <p class="power">can run faster than a cheetah</p>
    <p class="power">can lift sschool bus</p>

    <h2 class="label">weaknesses</h2>
    <p class="weakness">maths homework</p>
    <p class="weakness">broccoil</p>

    <p class="badge">top hero</p>

    <p class="made-by">creted by Jasmin</p>
</body>
</html>
