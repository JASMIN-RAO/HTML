<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Song Names</h3>
    <button onclick="sortAZ()">Sort A to Z</button>
    <button onclick="sortZA()">Sort Z to A</button>
    <div id="nameResult"></div>

    <h3>Play Counts</h3>
    <button onclick="sortLeast()">Least Played Frist</button>
    <button onclick="sortMost()">Most Played First</button>
     <div id="countResult"></div>

     <h3> Lable Every Play Count</h3>
     <button onclick="addLabel()">Add Plays Label</button>
     <div id="lableResult"></div>
     <script>
        var songs = ["Zoom","Bounce","Glow","Rush","Spark"];
        var plays = [320,85,210,50,175];

        document.getElementById("nameResult").innerHTML ="songs : " + songs;
          document.getElementById("countResult").innerHTML="plays : " + plays;
            document.getElementById("labelResult").innerHTML="Press the button above!";

            function sortAZ()  {songs.sort(); document.getElementById("nameResult").innerHTML="A to Z:"+ songs}
            function sortZA()  {songs.sort(); songs.reverse();
                document.getElementById("nameResult").innerHTML = "Z to A:" + songs;}

                function sortLeast() {plays.sort(function(a,b){return a-b});
            document.getElementById("countResult").innerHTML="Least played first:" + plays;}

            function sortMost() {plays.sort(function(a,b){return b-a});
            document.getElementById("countResult").innerHTML="Most played first:" + plays;}

            function addLabel()  {var 1 = plays.map(function(c) {return c+" plays";});
        document.getElementById("lableResult").innerHTML= "Lableled:" + 1;}
     </script>
</body>
</html>
