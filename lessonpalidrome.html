<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body {background-color:rgb(88, 4, 101);
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        color: aquamarine;
        padding: 20px;
font-weight: bold;
font-size: large;

        }

</head>
<body>
   <h1>palidrome</h1> 

   <script>
    function palidrome(mystring)
    {
        var input = mystring.replace(/[^a-z0-9]/ig,"").toLowerCase()

        var reversedinput =input.split('').reverse().join("")
        if (input == reversedinput){
            document.write("<div>"+mystring + " is a palidrome </div>")
        }
        else {
            document.write("<div>" + mystring + " is not a palidrome </div>")
        }
    }
    palidrome("jasmin")
   </script>
</body>
</html>
