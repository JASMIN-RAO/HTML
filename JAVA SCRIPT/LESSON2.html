<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions</title>
</head>
<body>
    <button onclick="mult(2);">Click me</button>
    <div id="result"></div> 
    <script>
        function mult(x,y){
            if (y==undefined){
                y=10
            }
            document.getElementById("result").innerHTML="The result is"+(x*y)
        }
    </script>
</body>
</html>
