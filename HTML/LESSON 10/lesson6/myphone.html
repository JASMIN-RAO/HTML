<body>

    <div id="phoneid"></div>
    <div id="schoolid"></div>
    <div id="cityid"></div>
   </div>
   <script>
    var mycontact={
        name:"JOANNY JASMIN",
        phone:"93985-95961",
        school:"GREEN CITY ENGLISH MEMDIUM SCHOOL",
        city:"VIZAG"
    }
    document.getElementById("nameid").innerHTML ="Name :"+mycontact.name
     document.getElementById("phoneid").innerHTML ="Phone :"+mycontact.phone
      document.getElementById("schoolid").innerHTML ="School :"+mycontact["school"]
       document.getElementById("cityid").innerHTML ="City :"+mycontact["city"]
   </script>
</body>
